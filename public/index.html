<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bjoerkelund</title>
  <meta name="description" content="Bjoerkelund, a small torp in the forests of Småland.">
  <style>
    :root {
      --bg: #f6f3ec;
      --text: #22261f;
      --muted: #6b6f63;
      --fade: 2.5s;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161813; --text: #e9e6dc; --muted: #9a9d90; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.6 Georgia, "Iowan Old Style", serif;
    }
    .hero {
      position: relative;
      height: min(78vh, 760px);
      min-height: 320px;
      overflow: hidden;
      background: #2b2f27;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity var(--fade) ease-in-out, transform 12s linear;
    }
    .hero img.on {
      opacity: 1;
      transform: scale(1);
    }
    @media (prefers-reduced-motion: reduce) {
      .hero img { transition: none; transform: none; }
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 48px 16px 72px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }
    p { margin: 0; }
  </style>
</head>
<body>
  <div class="hero" id="hero">
    <!-- Frost is the no-JS default; the script picks a start image for the season and time of day. -->
    <img class="on" alt="The red cottage on a frosty morning, seen past an old oak"
         src="/images/frost-900.jpg" srcset="/images/frost-900.jpg 675w, /images/frost-1600.jpg 1086w" sizes="100vw"
         style="object-position: 50% 55%" data-name="frost">
    <img alt="The cottage in early summer behind a meadow of lupins"
         data-srcset="/images/summer-900.jpg 900w, /images/summer-1600.jpg 1600w" sizes="100vw"
         style="object-position: 45% 60%" data-name="summer">
    <img alt="The cottage at dusk with warm light in the windows"
         data-srcset="/images/evening-900.jpg 900w, /images/evening-1600.jpg 1600w" sizes="100vw"
         style="object-position: 50% 45%" data-name="evening">
    <img alt="A basket of chanterelles and a cep picked in the autumn forest"
         data-srcset="/images/chanterelles-900.jpg 675w, /images/chanterelles-1600.jpg 1200w" sizes="100vw"
         style="object-position: 50% 60%" data-name="chanterelles">
  </div>
  <main>
    <h1>Bjoerkelund</h1>
    <p>Keeping a torp is a slow, seasonal craft: mending what the winter wears down, holding back the forest, and keeping the old house warm and dry until the next summer.</p>
  </main>
  <script>
    (() => {
      const SHOW_MS = 9000; // time each photo stays fully visible, before the fade
      const imgs = [...document.querySelectorAll("#hero img")];

      // Start with the photo that fits the moment, in Swedish time.
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Stockholm", month: "numeric", hour: "numeric", hourCycle: "h23" })
          .formatToParts(new Date()).map((p) => [p.type, Number(p.value)])
      );
      const { month, hour } = parts;
      const start =
        hour >= 21 || hour < 6 ? "evening" :
        month >= 12 || month <= 3 ? "frost" :
        month <= 8 ? "summer" : "chanterelles";

      const load = (img) => {
        if (img.dataset.srcset) {
          img.srcset = img.dataset.srcset;
          delete img.dataset.srcset;
        }
        return img.decode().catch(() => {});
      };

      let i = imgs.findIndex((img) => img.dataset.name === start);
      if (imgs[i].dataset.srcset) {
        load(imgs[i]).then(() => {
          imgs[0].classList.remove("on");
          imgs[i].classList.add("on");
        });
      } else {
        i = 0;
      }

      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const next = () => imgs[(i + 1) % imgs.length];
      load(next());

      setInterval(async () => {
        if (document.hidden) return;
        await load(next());
        imgs[i].classList.remove("on");
        i = (i + 1) % imgs.length;
        imgs[i].classList.add("on");
        load(next()); // fetch one ahead so the next fade never waits
      }, SHOW_MS);
    })();
  </script>
</body>
</html>
