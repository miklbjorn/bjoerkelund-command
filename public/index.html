<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Björkelund</title>
  <meta name="description" content="Björkelund – en 200 år gammel torp, dybt inde i Smålands skove.">
  <style>
    :root {
      --text: #f1eee4;
      --muted: #ead9cf;
      --falu: 128, 24, 24;                     /* falu red, #801818 */
      --shade: rgba(60, 10, 10, 0.16);         /* over the whole photo */
      --panel: rgba(var(--falu), 0.78);        /* behind the text */
      --sidebar: 16.5rem;
      --fade: 2.5s;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #1b1e18;
      color: var(--text);
      font: 17px/1.55 Georgia, "Iowan Old Style", serif;
    }
    .hero {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #2b2f27;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity var(--fade) ease-in-out, transform 12s linear;
    }
    .slide.on {
      opacity: 1;
      transform: scale(1);
    }
    .slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--shade);
    }
    @media (prefers-reduced-motion: reduce) {
      .slide { transition: none; transform: none; }
    }
    main {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: var(--sidebar);
      min-height: 100%;
      padding: 40px 28px;
      background: var(--panel);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2.1rem;
      font-weight: normal;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }
    p { margin: 0; color: var(--muted); }
    .login {
      align-self: flex-start;
      margin-top: 28px;
      padding: 9px 20px;
      border: 1px solid currentColor;
      border-radius: 999px;
      color: var(--text);
      font: 15px/1.2 system-ui, sans-serif;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .login:hover, .login:focus-visible {
      background: var(--text);
      color: rgb(var(--falu));
    }

    /* Phones: the whole photo above the text, on a heavily blurred copy of itself
       that fills the screen and runs behind the text. */
    @media (max-width: 640px) {
      body { display: flex; flex-direction: column; justify-content: flex-end; min-height: 100dvh; }
      .hero::after { display: none; }
      .slide::before {
        content: "";
        position: absolute;
        inset: -60px;  /* hide the soft edges the blur creates */
        background: var(--bg) center / cover no-repeat;
        filter: blur(36px) brightness(0.62) saturate(1.1);
      }
      /* Centre the photo in the space above the text. It always fills the full width,
         and only crops top/bottom if it is too tall for that space. */
      .slide {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: env(safe-area-inset-top) 0 var(--text-h, 38dvh);
      }
      .slide img {
        position: relative;
        inset: auto;
        width: 100%;
        height: auto;
        max-height: 100%;
        flex: none;
        object-fit: cover;
      }
      main {
        width: 100%;
        min-height: 0;
        padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, rgba(var(--falu), 0), rgba(var(--falu), 0.55) 45%, rgba(var(--falu), 0.7));
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="hero" id="hero">
    <!-- Frost is the no-JS default; the script picks a start image for the season and time of day. -->
    <div class="slide on" data-name="frost" style="--bg: url(/images/frost-900.jpg)">
      <img alt="Det røde hus en frostklar morgen, set forbi en gammel eg"
           src="/images/frost-900.jpg" srcset="/images/frost-900.jpg 675w, /images/frost-1600.jpg 1086w" sizes="100vw"
           style="object-position: 50% 55%">
    </div>
    <div class="slide" data-name="summer">
      <img alt="Huset i forsommeren bag en eng med lupiner"
           data-srcset="/images/summer-900.jpg 900w, /images/summer-1600.jpg 1600w" sizes="100vw"
           style="object-position: 45% 60%">
    </div>
    <div class="slide" data-name="evening">
      <img alt="Huset i skumringen med varmt lys i vinduerne"
           data-srcset="/images/evening-900.jpg 900w, /images/evening-1600.jpg 1600w" sizes="100vw"
           style="object-position: 50% 45%">
    </div>
    <div class="slide" data-name="chanterelles">
      <img alt="En kurv med kantareller og en karljohan fra efterårsskoven"
           data-srcset="/images/chanterelles-900.jpg 675w, /images/chanterelles-1600.jpg 1200w" sizes="100vw"
           style="object-position: 50% 60%">
    </div>
  </div>
  <main id="text">
    <h1>Björkelund</h1>
    <p>En 200 år gammel torp, dybt inde i Smålands skove.</p>
    <a class="login" href="/admin" rel="nofollow">Log ind</a>
  </main>
  <script>
    (() => {
      const SHOW_MS = 9000; // time each photo stays fully visible, before the fade
      const slides = [...document.querySelectorAll("#hero .slide")];

      // On phones the photo sits above the text, so it needs to know how tall the text is.
      const text = document.getElementById("text");
      const setTextHeight = () => document.documentElement.style.setProperty("--text-h", `${text.offsetHeight}px`);
      new ResizeObserver(setTextHeight).observe(text);
      setTextHeight();

      // Start with the photo that fits the moment, in Swedish time.
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Stockholm", month: "numeric", hour: "numeric", hourCycle: "h23" })
          .formatToParts(new Date()).map((p) => [p.type, Number(p.value)])
      );
      const { month, hour } = parts;
      const start =
        hour >= 21 || hour < 6 ? "evening" :
        month >= 12 || month <= 3 ? "frost" :
        month <= 8 ? "summer" : "chanterelles";

      // The blurred phone background reuses whichever file the browser picked, so it costs no extra download.
      const load = async (slide) => {
        const img = slide.querySelector("img");
        if (img.dataset.srcset) {
          img.srcset = img.dataset.srcset;
          delete img.dataset.srcset;
        }
        await img.decode().catch(() => {});
        if (img.currentSrc) slide.style.setProperty("--bg", `url("${img.currentSrc}")`);
      };

      let i = slides.findIndex((s) => s.dataset.name === start);
      if (i > 0) {
        load(slides[i]).then(() => {
          slides[0].classList.remove("on");
          slides[i].classList.add("on");
        });
      } else {
        i = 0;
      }

      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const next = () => slides[(i + 1) % slides.length];
      load(next());

      setInterval(async () => {
        if (document.hidden) return;
        await load(next());
        slides[i].classList.remove("on");
        i = (i + 1) % slides.length;
        slides[i].classList.add("on");
        load(next()); // fetch one ahead so the next fade never waits
      }, SHOW_MS);
    })();
  </script>
</body>
</html>
